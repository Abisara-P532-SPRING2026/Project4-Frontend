<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plans RPL</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page">
  <header class="topbar">
    <a class="brand" href="index.html">RPL</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="plan-view.html" class="active">Plans</a>
      <a href="action-detail.html">Actions</a>
      <a href="ledger-view.html">Ledger</a>
      <a href="report.html">Report</a>
    </nav>
  </header>
  <main class="main">
    <div class="card">
      <p class="card-title">Plan Tree</p>
      <div class="field">
        <label for="planId">Plan ID</label>
        <input id="planId" type="number" value="1" min="1">
        <button class="btn btn-primary" onclick="loadPlan()">Load</button>
      </div>
      <ul class="tree" id="tree"></ul>
    </div>
    <div class="card">
      <p class="card-title">Plan metrics</p>
      <button type="button" class="btn btn-primary" onclick="loadMetrics()">Load metrics</button>
      <div class="metrics-panel" id="metricsPanel"></div>
    </div>
  </main>
  <script>
    const API_BASE = "https://project4-backened-1.onrender.com";

    function statusBadge(status) {
      const raw = (status || "PROPOSED").toLowerCase();
      const label = raw.replace(/_/g, " ");
      return `<span class="badge badge-${raw}">${label}</span>`;
    }

    /** Render a plan node (composite): actions then nested sub-plans (recursive). */
    function renderPlanBranch(plan) {
      const li = document.createElement("li");
      li.innerHTML = `<span><strong>${plan.name}</strong></span>${statusBadge(plan.status || "PROPOSED")}`;
      const kids = document.createElement("ul");
      kids.className = "tree";

      (plan.actions || []).forEach(action => {
        const aLi = document.createElement("li");
        aLi.className = "tree-child";
        aLi.innerHTML = `<span>${action.name}</span>${statusBadge(action.status)}`;
        kids.appendChild(aLi);
      });

      (plan.subPlans || []).forEach(sub => {
        kids.appendChild(renderPlanBranch(sub));
      });

      if (kids.childElementCount > 0) {
        li.appendChild(kids);
      }
      return li;
    }

    async function loadPlan() {
      const id = document.getElementById("planId").value;
      const tree = document.getElementById("tree");
      tree.innerHTML = "";
      try {
        const plan = await fetch(`${API_BASE}/api/plans/${id}`).then(r => r.json());
        tree.appendChild(renderPlanBranch(plan));
      } catch {
        tree.innerHTML = `<li style="color:var(--muted)">Could not load plan.</li>`;
      }
    }

    async function loadMetrics() {
      const id = document.getElementById("planId").value;
      const panel = document.getElementById("metricsPanel");
      panel.innerHTML = `<div class="metrics-box" style="grid-column:1/-1">Loading…</div>`;
      try {
        const progress = await fetch(`${API_BASE}/api/plans/${id}/metrics?type=progress`).then(r => r.json());
        const utilisation = await fetch(`${API_BASE}/api/plans/${id}/metrics?type=utilisation`).then(r => r.json());
        const overdue = await fetch(`${API_BASE}/api/plans/${id}/metrics?type=overdue`).then(r => r.json());

        panel.innerHTML = "";

        const progBox = document.createElement("div");
        progBox.className = "metrics-box";
        progBox.innerHTML = `<strong>Progress</strong>
          total ${progress.total}, completed ${progress.completed}, ${Number(progress.percentComplete).toFixed(1)}%`;

        const utilBox = document.createElement("div");
        utilBox.className = "metrics-box";
        utilBox.innerHTML = `<strong>Resource utilisation</strong><pre style="margin:0;background:transparent;color:inherit;padding:0;font-size:12px">${JSON.stringify(utilisation, null, 2)}</pre>`;

        const odBox = document.createElement("div");
        odBox.className = "metrics-box";
        odBox.innerHTML = `<strong>Overdue</strong><pre style="margin:0;background:transparent;color:inherit;padding:0;font-size:12px">${JSON.stringify(overdue, null, 2)}</pre>`;

        panel.appendChild(progBox);
        panel.appendChild(utilBox);
        panel.appendChild(odBox);
      } catch (e) {
        panel.innerHTML = `<div class="metrics-box" style="grid-column:1/-1;color:var(--danger)">${e.message}</div>`;
      }
    }
  </script>
</body>
</html>
